@media (prefers-color-scheme:dark){:root{--bg:#0d1624;--card:#15233a;--ink:#e8eefb;--mute:#93a3c0;--line:#27395a;--main:#2dd4bf;--main-ink:#06201d;--rec:#ff6b70;--soft:#12363a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.7 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;margin:12px 0 4px}
h2{font-size:1.25rem;margin:8px 0}
p{margin:6px 0}.mute{color:var(--mute);font-size:.92rem}
.grid{display:grid;gap:12px;margin-top:16px}
.choice{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;font:inherit;cursor:pointer}
.choice:hover,.choice:focus-visible{border-color:var(--main);outline:none}
.choice b{display:block;font-size:1.1rem}
.choice span{color:var(--mute);font-size:.9rem}
.back{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:6px 0}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:18px;margin-top:14px}
.en{font-size:1.15rem;line-height:1.8}
.btn{background:var(--main);color:var(--main-ink);border:0;border-radius:12px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.rec{background:var(--rec);color:#fff}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ring{position:relative;width:132px;height:132px;margin:10px auto}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-size:2rem;font-weight:700}
.stage{text-align:center;font-weight:700}
.scene{font-size:3rem;text-align:center;line-height:1.4}
label.ck{display:flex;gap:10px;align-items:flex-start;margin:6px 0;cursor:pointer}
audio{width:100%;margin-top:10px}
.ref{background:var(--soft);border-radius:10px;padding:10px 14px;margin-top:10px}
.bar{height:6px;background:var(--line);border-radius:3px;margin-top:8px}.bar i{display:block;height:100%;background:var(--main);border-radius:3px}
.inp{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);margin-top:6px}.hello{display:flex;justify-content:space-between;align-items:center}a.btn{text-decoration:none;display:inline-block}.seg{margin:10px 0}.seg .btn{padding:8px 16px}.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:14px}.sets .choice{padding:12px 14px;text-align:center}.sets .choice.dn{border-color:var(--main);background:var(--soft)}.sets small{display:block;color:var(--mute);font-size:.8rem;line-height:1.3;margin-top:2px}.hide{display:none}
</style>

u enjoy listening to?","ref":"I enjoy pop music because it is cheerful and easy to sing along.","sec":15},{"q":"Do you think students should wear uniforms? Why or why not?","ref":"I think uniforms are a good idea. They make students equal and save time in the morning. However, some students feel they cannot express their own style.","sec":30}],"pic":[{"title":"下雨的公車站","scene":"🏢🚌🌧️ 🧑‍💼☂️ 🧑‍🎓📱","qs":["Please describe what the people are doing at the bus stop.","What might happen next?","What do you usually do when it rains and you have to go out?"]},{"title":"圖書館","scene":"📚🪑 👩‍🏫 🧑‍🎓🧑‍🎓 💻","qs":["Please describe the scene in the library.","Why do you think the students are working together?","Do you like studying in a library? Why or why not?"]},{"title":"咖啡店","scene":"☕🍰 👩‍💻 👨‍💼 🪴","qs":["Please describe what the people are doing in the café.","Why might people choose to work in a café?","Where do you like to study or work? Why?"]},{"title":"公園運動","scene":"🌳🏃‍♀️🚴 🧘 🐕","qs":["Please describe the activities in the park.","What are the benefits of exercising outdoors?","How often do you exercise, and what do you usually do?"]},{"title":"搬家","scene":"📦🚚 👨 👩 🛋️","qs":["Please describe what the people are doing.","What problems might they have while moving?","Have you ever moved to a new place? How did you feel?"]},{"title":"火車站","scene":"🚉🚆 🧳 👨‍👩‍👧 ⏰","qs":["Please describe the people at the station.","What might they be worried about?","Do you prefer traveling by train or by car? Why?"]},{"title":"傳統市場","scene":"🥬🍅🐟 🧓 👩 🛒","qs":["Please describe the scene at the market.","Why do some people prefer traditional markets to supermarkets?","Where does your family usually buy food?"]},{"title":"校慶活動","scene":"🎪🎈🎤 🧑‍🎓🧑‍🎓 👏","qs":["Please describe the event.","How might the students feel about it?","What school activity do you remember most? Why?"]}]}};
/*BANK_END*/
for(const lv in BANK)for(const k in BANK[lv])DATA[lv].tasks[k].items=BANK[lv][k];

/* ===== AI 出題設定 =====
   把 Cloudflare Worker 的網址貼在這裡（做法見 worker.js 開頭說明）。
   留空代表只使用上面的內建題庫。請不要把 API 金鑰寫在這個檔案裡。 */
const AI_ENDPOINT="";
/* 練習紀錄：貼上 Google Apps Script 網址（見 tracking-apps-script.gs），留空則不記錄 */
const LOG_URL="https://script.google.com/macros/s/AKfycbzfJJCeSZeSnBZxzNi_MQlmAth_6wpMg3Mpul3pojf0pKtOpV2kKOn3B41_rZEXYCAK/exec";

const app=document.getElementById("app");
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let S={name:"",src:"bank",level:null,task:null,items:[],i:0,stream:null,rec:null,chunks:[],tick:null,runId:0,note:"",ai:false};
try{S.name=localStorage.getItem("gept_name")||""}catch(e){}
const TTS="speechSynthesis" in window;
let VOICE=null;
let PREF={voice:"",rate:.9};
try{PREF={...PREF,...JSON.parse(localStorage.getItem("gept_voice")||"{}")}}catch(e){}
function savePref(){try{localStorage.setItem("gept_voice",JSON.stringify(PREF))}catch(e){}}
function enVoices(){return TTS?speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)):[]}
function pickVoice(){const v=enVoices();VOICE=v.find(x=>x.voiceURI===PREF.voice)||v.find(x=>/^en[-_]US/i.test(x.lang))||v[0]||null}
function fillVoices(){const s=$("vs");if(!s)return;const v=enVoices();s.innerHTML=v.length?v.map(x=>`<option value="${esc(x.voiceURI)}"${VOICE&&x.voiceURI===VOICE.voiceURI?" selected":""}>${esc(x.name)}（${esc(x.lang)}）</option>`).join(""):"<option>此裝置沒有英文語音</option>"}
function initVoice(){
  app.insertAdjacentHTML("beforeend",`<details class="card"><summary>🔊 語音設定（音色與速度）</summary>
  <p class="mute">聽不清楚時，可以換一種音色或調慢速度。</p><label for="vs">音色</label><select id="vs" class="inp"></select>
  <label for="vr" style="display:block;margin-top:10px">速度</label><select id="vr" class="inp"><option value="0.7">慢</option><option value="0.9">正常</option><option value="1.05">快</option></select>
  <div class="row"><button class="btn alt" id="vt">試聽</button></div></details>`);
  fillVoices();$("vr").value=String(PREF.rate);
  $("vs").onchange=()=>{PREF.voice=$("vs").value;savePref();pickVoice()};
  $("vr").onchange=()=>{PREF.rate=+$("vr").value;savePref()};
  $("vt").onclick=()=>speak("I go to school by bus every day.",1);
}
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=()=>{pickVoice();fillVoices()}}
function T(){return DATA[S.level].tasks[S.task]}

function nameScreen(){
  stop();
  app.innerHTML=`<h1>桃源國中GEPT口說練習</h1><p class="mute">先輸入你的姓名，下載錄音檔時會用到。</p>
  <div class="card"><label for="nm">姓名</label><input id="nm" class="inp" maxlength="20" autocomplete="name" value="${esc(S.name)}">
  <div class="row"><button class="btn" id="ok">開始練習</button></div><p class="mute" id="er"></p></div>`;
  const go=()=>{const v=$("nm").value.trim();if(!v){$("er").textContent="請輸入姓名";return}S.name=v;try{localStorage.setItem("gept_name",v)}catch(e){}home()};
  $("ok").onclick=go;$("nm").onkeydown=e=>{if(e.key==="Enter")go()};
}
function home(){
  if(!S.name)return nameScreen();
  stop();
  app.innerHTML=`<p class="mute" style="margin-top:8px">桃源國中GEPT口說練習</p><div class="hello"><h1>Hi, ${esc(S.name)}</h1><button class="back" id="chg">換人</button></div><p class="mute">選擇級數，再選練習項目。錄音只留在你的手機或電腦，不會上傳。</p>
  <div class="grid">${Object.entries(DATA).map(([k,v])=>`<button class="choice" data-lv="${k}"><b>${v.name}</b><span>${v.desc}</span></button>`).join("")}</div>`;
  $("chg").onclick=nameScreen;initVoice();
  app.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>menu(b.dataset.lv));
}
function menu(lv){
  stop();S.level=lv;const L=DATA[lv];
  app.innerHTML=`<button class="back" id="bk">‹ 回到選級數</button><h1>${L.name}口說</h1>
  ${AI_ENDPOINT?`<div class="row seg"><button class="btn ${S.src==="bank"?"":"alt"}" data-s="bank">內建題庫</button><button class="btn ${S.src==="ai"?"":"alt"}" data-s="ai">AI 新題目</button></div>`:""}
  <p class="mute">選一個項目開始練習</p>
  <div class="grid">${Object.entries(L.tasks).map(([k,t])=>`<button class="choice" data-t="${k}"><b>${t.name}</b><span>${t.desc}</span></button>`).join("")}</div>`;
  $("bk").onclick=home;
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{S.src=b.dataset.s;menu(lv)});
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>start(b.dataset.t));
}

async function start(k){
  const t=DATA[S.level].tasks[k];S.task=k;S.ai=false;
  if(S.src==="ai"&&AI_ENDPOINT){
    app.innerHTML=`<p class="stage" style="margin-top:40px">AI 正在出題，約需 5–15 秒…</p>`;
    const items=await aiItems(k,t);
    if(items){S.bank=items;S.items=items;S.set=0;S.i=0;S.ai=true;return question()}
    S.note="AI 暫時無法出題，已改用內建題庫。";
  }
  S.bank=t.items;sets();
}
function getDone(){try{return JSON.parse(localStorage.getItem("gept_done_"+S.name))||{}}catch(e){return {}}}
function markDone(){try{const d=getDone(),k=S.level+"|"+S.task;d[k]=[...new Set([...(d[k]||[]),S.set])];localStorage.setItem("gept_done_"+S.name,JSON.stringify(d))}catch(e){}}
function sets(){
  stop();const t=T(),n=Math.ceil(S.bank.length/4),dn=getDone()[S.level+"|"+S.task]||[],nm=(t.names||"").split("|");
  app.innerHTML=`<button class="back" id="bk">‹ ${DATA[S.level].name}口說</button><h1>${t.name}</h1><p class="mute">共 ${n} 回，每回 4 題。你已完成 ${dn.length} 回。</p>
  <div class="sets">${Array.from({length:n},(_,i)=>`<button class="choice ${dn.includes(i)?"dn":""}" data-n="${i}"><b>第 ${i+1} 回${dn.includes(i)?" ✓":""}</b>${nm[i]?`<small>${esc(nm[i])}</small>`:""}</button>`).join("")}</div>`;
  $("bk").onclick=()=>menu(S.level);
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{S.set=+b.dataset.n;S.items=S.bank.slice(S.set*4,S.set*4+4);S.i=0;question()});
}
async function aiItems(k,t){
  try{
    const c=new AbortController(),to=setTimeout(()=>c.abort(),30000);
    const r=await fetch(AI_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({level:S.level,task:k,count:5}),signal:c.signal});
    clearTimeout(to);if(!r.ok)return null;
    const d=await r.json();return clean(d.items,t.mode);
  }catch(e){return null}
}
function clean(a,mode){
  if(!Array.isArray(a))return null;
  const s=x=>typeof x==="string"&&x.trim()?x.trim().slice(0,600):null,out=[];
  for(const o of a.slice(0,80)){
    if(!o||typeof o!=="object")continue;
    if(mode==="read"){const t=s(o.t);if(t)out.push({t})}
    else if(mode==="listen"){const q=s(o.q);if(q)out.push({q,ref:s(o.ref)||undefined,sec:o.sec===15||o.sec===30?o.sec:undefined})}
    else{const qs=Array.isArray(o.qs)?o.qs.map(s).filter(Boolean).slice(0,4):[],sc=s(o.scene);if(qs.length&&sc)out.push({scene:sc,title:s(o.title)||"圖片",qs})}
  }
  return out.length?out:null;
}

function question(){
  stop();const t=T(),it=S.items[S.i],n=S.items.length;
  let body="";
  if(t.mode==="read")body=`<p class="mute">先默讀，準備時間到了就開始朗讀。</p><p class="en">${esc(it.t)}</p>`;
  if(t.mode==="listen")body=`<p class="mute">按「開始」後會播放題目${t.plays>1?"（播放 "+t.plays+" 次）":""}，題目文字不會顯示。${t.tip||""}請把手機音量調大。</p>`;
  if(t.mode==="picture")body=`<h2>${it.img?"":esc(it.title)}</h2>${it.img?`<img src="${esc(it.img)}" alt="" style="max-width:100%;border-radius:10px">`:`<div class="scene" aria-label="${esc(it.title)}">${esc(it.scene)}</div>`}<ol class="en">${it.qs.map(q=>`<li>${esc(q)}</li>`).join("")}</ol>`;
  const note=S.note;S.note="";
  app.innerHTML=`<button class="back" id="bk">‹ ${DATA[S.level].name}・${t.name}${S.ai?"":"・第"+(S.set+1)+"回"}</button>
  <div class="bar"><i style="width:${(S.i/n)*100}%"></i></div><p class="mute">第 ${S.i+1} / ${n} 題・${esc(S.name)}${S.ai?"・AI 出題":""}</p>${note?`<p class="mute">${esc(note)}</p>`:""}
  <div class="card">${body}<div class="ring hide" id="ring"><svg width="132" height="132"><circle cx="66" cy="66" r="58" fill="none" stroke="var(--line)" stroke-width="10"/><circle id="arc" cx="66" cy="66" r="58" fill="none" stroke="var(--main)" stroke-width="10" stroke-linecap="round" stroke-dasharray="364.4" stroke-dashoffset="0"/></svg><div class="n" id="num"></div></div>
  <p class="stage" id="stage"></p><div class="ref hide" id="fb"></div><div class="row" id="ctl"><button class="btn" id="go">開始</button></div></div><div id="after"></div>`;
  $("bk").onclick=()=>S.ai?menu(S.level):sets();$("go").onclick=run;
}

function countdown(sec,label){
  return new Promise(res=>{
    const id=S.runId;let left=sec;$("ring").classList.remove("hide");$("stage").textContent=label;
    const draw=()=>{$("num").textContent=left;$("arc").style.strokeDashoffset=364.4*(1-left/sec)};draw();
    S.tick=setInterval(()=>{if(id!==S.runId){clearInterval(S.tick);return}left--;draw();if(left<=0){clearInterval(S.tick);res(true)}},1000);
    S.skip=()=>{clearInterval(S.tick);res(false)};
  });
}
function speak(text,times){
  return new Promise(res=>{
    if(!TTS){res(false);return}
    let c=0,done=false;
    const fin=ok=>{if(!done){done=true;res(ok)}};
    const once=()=>{
      const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=PREF.rate;u.volume=1;if(VOICE)u.voice=VOICE;
      let h=false;
      const next=()=>{if(h)return;h=true;clearTimeout(guard);c++;c<times?setTimeout(once,1500):fin(true)};
      const guard=setTimeout(next,(text.split(/\s+/).length*600)+4000);
      u.onend=next;u.onerror=()=>{if(h)return;h=true;clearTimeout(guard);fin(false)};
      speechSynthesis.speak(u);
    };
    once();
  });
}
function micMsg(e){
  const n=e&&e.name;
  if(n==="NotAllowedError"||n==="SecurityError")return "麥克風被封鎖了。請在瀏覽器網址列旁的設定中允許麥克風，再重新整理頁面。";
  if(n==="NotFoundError")return "找不到麥克風，請接上耳機麥克風後重新整理頁面。";
  if(n==="NotReadableError")return "麥克風正被其他程式使用，請關閉通話或錄音程式後再試。";
  return "無法使用麥克風，請重新整理頁面再試一次。";
}
async function run(){
  const id=++S.runId,t=T(),it=S.items[S.i],sec=it.sec||t.answer;
  /* 手機要求「點擊當下」就啟動語音，所以先送出一個無聲的語音來解鎖 */
  if(TTS&&t.mode==="listen"){const u=new SpeechSynthesisUtterance("a");u.volume=0;speechSynthesis.speak(u)}
  $("ctl").innerHTML="";
  try{(await navigator.mediaDevices.getUserMedia({audio:true})).getTracks().forEach(x=>x.stop())}
  catch(e){$("stage").textContent=micMsg(e);$("ctl").innerHTML=`<button class="btn" id="go">再試一次</button>`;$("go").onclick=run;return}
  if(id!==S.runId)return;
  if(t.mode==="listen"){
    $("stage").textContent="請聽題目…";
    const ok=await speak(it.q,t.plays);if(id!==S.runId)return;
    if(!ok){$("fb").classList.remove("hide");$("fb").innerHTML="這個瀏覽器無法播放語音，題目是：<br><b>"+esc(it.q)+"</b>"}
  }
  if(t.prep>0){$("ctl").innerHTML=`<button class="btn alt" id="sk">跳過準備</button>`;$("sk").onclick=()=>S.skip&&S.skip();await countdown(t.prep,"準備中");if(id!==S.runId)return}
  try{S.stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){$("stage").textContent=micMsg(e);return}
  if(id!==S.runId){S.stream.getTracks().forEach(x=>x.stop());S.stream=null;return}
  S.chunks=[];S.rec=new MediaRecorder(S.stream);
  S.rec.ondataavailable=e=>S.chunks.push(e.data);
  S.rec.onstop=()=>finish(id);
  S.rec.start();S.t0=Date.now();
  $("ctl").innerHTML=`<button class="btn rec" id="st">錄音中・按此停止</button>`;
  $("st").onclick=()=>{S.skip&&S.skip()};
  await countdown(sec,"請開始說話");
  if(id!==S.runId)return;
  if(S.rec&&S.rec.state==="recording")S.rec.stop();
}
function finish(id){
  if(S.stream){S.stream.getTracks().forEach(x=>x.stop());S.stream=null}
  if(id!==S.runId)return;
  clearInterval(S.tick);
  const t=T(),it=S.items[S.i],mt=S.rec.mimeType||"audio/webm",url=URL.createObjectURL(new Blob(S.chunks,{type:mt}));
  const fname=[S.name,DATA[S.level].name,t.name,S.i+1].join("_").replace(/[\\/:*?"<>|\s]/g,"")+(mt.includes("mp4")?".m4a":".webm");
  $("ring").classList.add("hide");$("stage").textContent="錄音完成";
  const last=S.i>=S.items.length-1;
  if(last&&!S.ai)markDone();
  log({name:S.name,level:DATA[S.level].name,task:t.name,set:S.ai?0:S.set+1,done:last?1:0,item:String(it.q||it.t||it.title||"").slice(0,80),sec:Math.round((Date.now()-S.t0)/1000)});
  const reveal=t.mode==="listen"?`<div class="ref"><b>題目：</b>${esc(it.q)}${it.ref?`<br><b>參考回答：</b>${esc(it.ref)}`:""}</div>`:"";
  $("ctl").innerHTML="";
  $("after").innerHTML=`<div class="card"><b>聽聽自己的錄音</b><audio controls src="${url}"></audio>${reveal}
  <p style="margin-top:14px"><b>自我檢查</b></p>${t.check.map(c=>`<label class="ck"><input type="checkbox"> <span>${c}</span></label>`).join("")}
  <div class="row"><button class="btn alt" id="rt">再試一次</button>${t.mode==="listen"?`<button class="btn alt" id="rp">🔊 再聽一次題目</button>`:""}<a class="btn alt" download="${esc(fname)}" href="${url}">下載錄音</a>${last?`<button class="btn" id="dn">完成練習</button>`:`<button class="btn" id="nx">下一題</button>`}</div></div>`;
  $("rt").onclick=question;if($("rp"))$("rp").onclick=()=>speak(it.q,1);
  if(last)$("dn").onclick=()=>S.ai?menu(S.level):sets();else $("nx").onclick=()=>{S.i++;question()};
}
function stop(){
  S.runId++;clearInterval(S.tick);
  if(TTS)speechSynthesis.cancel();
  if(S.rec&&S.rec.state==="recording"){S.rec.onstop=null;S.rec.stop()}
  if(S.stream){S.stream.getTracks().forEach(x=>x.stop());S.stream=null}
}
function log(o){if(!LOG_URL)return;try{fetch(LOG_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain"},body:JSON.stringify(o)})}catch(e){}}
/* 讀取每週自動更新的 questions.json；讀不到就用上面的內建題庫 */
async function loadBank(){
  try{
    const r=await fetch("questions.json?v="+Date.now());if(!r.ok)return;
    const j=await r.json();
    for(const lv in j)for(const k in j[lv]){const t=DATA[lv]&&DATA[lv].tasks[k];if(!t)continue;const it=clean(j[lv][k],t.mode);if(it)t.items=it}
  }catch(e){}
}
loadBank().then(home);
</script>
